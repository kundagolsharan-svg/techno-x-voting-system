{% extends "base.html" %}
{% block content %}
<div style="max-width: 460px; margin: 2rem auto;">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="font-size: 3rem; margin-bottom: 0.75rem;">🗳️</div>
    <h1 class="page-title">Voter Login</h1>
    <p class="page-subtitle">Enter your USN to proceed to the voting booth.</p>
  </div>

  <div class="glass-card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="usn">Your USN</label>
        <input type="text" name="usn" id="usn" required
               placeholder="e.g. 2TG23CS001"
               style="text-transform: uppercase; font-size: 1.05rem; letter-spacing: 0.05em;">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
        Proceed to Vote →
      </button>
    </form>
  </div>

  <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.85rem;">
    Your vote is confidential and secured.
  </p>
</div>
{% endblock %}
